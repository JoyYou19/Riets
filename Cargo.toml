[workspace]
resolver = "2"
members = [
  # "crates/core-server",
  "crates/core-runtime",
  "crates/core-core",
  "crates/core-storage",
  "crates/core-index",
  "crates/core-query",
  # "crates/core-parser",
  "crates/core-auth",
  # "crates/core-api",
  "crates/core-protocol",
  # "crates/core-cluster",
  # "crates/core-observability",
  # "crates/core-admin",
  # "crates/core-migration",
  "crates/core-testkit",
]

[workspace.package]
edition = "2024"
license = "proprietary"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
criterion = "0.8.2"
