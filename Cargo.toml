[workspace]
resolver = "2"
members = [
  # "crates/core-server",
  "crates/core-runtime",
  "crates/core-core",
  "crates/core-storage",
  "crates/core-index",
  "crates/core-query",
  # "crates/core-parser",
  "crates/core-auth",
  # "crates/core-api",
  "crates/core-protocol",
  # "crates/core-cluster",
  # "crates/core-observability",
  # "crates/core-admin",
  # "crates/core-migration",
  "crates/core-logs",
  "crates/core-backup",
  "crates/core-timing",
  "crates/core-timing-macros",
  "crates/core-embed",
  ]

[workspace.package]
edition = "2024"
license = "proprietary"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
criterion = "0.8.2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }   # priority -1 so the overrides below win
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Hand-picked from the "restriction" group (never enable that group wholesale)
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"           # forces `?` / `expect("why")` instead

[workspace.lints.rust]
unreachable_pub = "warn"       # pub → pub(crate) where possible
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"