[package]
name = "core-backup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bincode="2.0"

serde = { workspace = true, features =["derive"]}
core-storage = { path = "../core-storage" }
core-timing = { path = "../core-timing" }
core-logs ={path = "../core-logs"}
chrono = "0.4.45"
flate2 = { version = "1.1", features = ["zlib-rs"], default-features = false }
tar = "0.4"
slog ="2"
slog-async="2"
slog-term="2"
slog-envlogger="2"
slog-scope="4"
tokio.workspace = true
simd-json = "0.18.1"
[features]
timing = ["core-timing/timing", "core-storage/timing"]
