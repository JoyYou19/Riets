[package]
name = "core-backup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bincode="2.0"
serde_json = "1"
serde = { workspace = true, features =["derive"]}
core-storage = { path = "../core-storage" }
core-timing = { path = "../core-timing" }
core-logs ={path = "../core-logs"}
chrono = "0.4.45"
flate2 ="1.0"
tar = "0.4"
slog ="2"
slog-async="2"
slog-term="2"
slog-envlogger="2"
slog-scope="4"

[features]
timing = ["core-timing/timing", "core-storage/timing"]