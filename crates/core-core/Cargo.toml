[package]
name = "core-core"
version = "0.1.0"
edition = "2024"

[dependencies]
core-index = { path = "../core-index" }
core-query = { path = "../core-query" }
core-storage = { path = "../core-storage" }
core-protocol = {path = "../core-protocol" }
core-logs={path="../core-logs"}
core-backup ={path ="../core-backup"}
core-timing = { path = "../core-timing" }
slog="2"
slog-async="2"
bincode="2.0"
chrono="0.4"
serde = { workspace = true }
serde_json = "1"
crossbeam-channel = "0.5"
thiserror = "2"
toml = "1.1.2"
indexmap = "2.14.0"
tokio = { workspace = true }
parking_lot = "0.12.5"
dashmap = "6.2.1"
moka = "0.12.16"
slog-scope = "4.4.1"



[features]
timing = [
  "core-timing/timing",
  "core-index/timing",
  "core-query/timing",
  "core-storage/timing",
  "core-backup/timing",
]
