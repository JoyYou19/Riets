[package]
name = "core-embed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fastembed = { version = "6", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }

ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "cuda", "api-22"] }
# The versions fastembed uses, so each compiles once; their features come from fastembed.
tokenizers = { version = "0.23", default-features = false }
hf-hub = { version = "0.5", default-features = false }
serde_json = "1"
[lints]
workspace = true
