[package]
name = "core-embed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# NVIDIA GPUs. Building needs the CUDA toolkit (nvcc); the binary needs the NVIDIA driver to start.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# fancy-regex: the pure-Rust regex engine instead of the C library (onig)
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
serde_json = "1"
fmt = "0.1.0"

# Apple GPUs: every macOS build uses Metal
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[lints]
workspace = true
