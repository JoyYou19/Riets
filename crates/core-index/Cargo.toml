[package]
name = "core-index"
version = "0.1.0"
edition = "2024"

[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
toml = "1.1.2"

# Async/runtime
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

# Logging / observability
tracing = "0.1"

# Concurrency helpers
parking_lot = "0.12"
arc-swap = "1.9.1"

# Utilities
smallvec = "1.13"
ahash = "0.8"

# Optional compression experiments
lz4_flex = "0.13.1"
memmap2 = "0.9.10"
rayon = "1.12.0"

tantivy = "0.26.1"

[dev-dependencies]
criterion = {workspace = true}
rand = "0.10.1"

[[bench]]
name = "index_bench"
harness = false
