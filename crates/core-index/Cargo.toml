[package]
name = "core-index"
version = "0.1.0"
edition = "2024"

[dependencies]
# Error handling

thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }





# Logging / observability

core-timing = { path = "../core-timing" }
slog="2"

# Concurrency helpers

arc-swap = "1.9.3"

# Utilities
smallvec = "1.16"
roaring = "0.12"
ahash = "0.8"

# Optional compression experiments
lz4_flex = "0.14.0"
memmap2 = "0.9.12"
rayon = "1.12.0"

levenshtein_automata = { version = "0.2.1", features = ["fst_automaton"] }
fst = "0.4.7"
rust-stemmers = "1.2"
serde_json = "1.0.154"
regex = "1.13.1"


[features]
timing = ["core-timing/timing"]


[lints] 
workspace = true
