[package]
name = "core-runtime"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }

[dependencies]
core-index = { path = "../core-index" }
core-query = { path = "../core-query" }
core-storage = { path = "../core-storage" }
core-core = { path = "../core-core" }

serde = { workspace = true }
tokio = {workspace = true}
serde_json = "1"
tracing = "0.1.44"
thiserror = "2"
toml = "1.1.2"
axum = "0.8.9"
reqwest = "0.13.4"

