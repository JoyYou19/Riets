[package]
name = "core-runtime"
version = "0.1.0"
edition = "2024"


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }


[features]
timing = [
  "core-timing/timing",
  "core-core/timing",
  "core-storage/timing",
  "core-index/timing",
  "core-query/timing",
  "core-protocol/timing",
]

[dependencies]
core-index = { path = "../core-index" }
core-query = { path = "../core-query" }
core-protocol = { path = "../core-protocol" }
core-storage = { path = "../core-storage" }
core-core = { path = "../core-core" }
core-auth = {path = "../core-auth"}
core-logs ={path ="../core-logs"}
core-timing={path ="../core-timing"}
core-backup ={path="../core-backup"}
core-embed = { path = "../core-embed" }
uuid = { version = "1.29.0", features = ["v4"] }
serde = { workspace = true,}
tokio = { workspace = true }
slog ="2"
slog-async="2"
slog-term="2"

slog-scope="4"
thiserror = "2"
toml = "1.2.0"
axum = { version = "0.8.9", features = ["macros"] }
reqwest = "0.13.5"
indexmap = { version = "2.14.2", features = ["serde"] }
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
parking_lot = "0.13.0"
tower-http = { version = "0.7", features = ["cors", "decompression-gzip", "compression-full", "trace", "timeout"] }
tower_governor = "0.8.0"
governor = "0.10.4"
simd-json = "0.19.0"
mimalloc = "0.1"
serde_json = "1.0.154"

[lints] 
workspace = true
