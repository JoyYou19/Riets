[package]
name = "core-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
core-protocol = { path = "../core-protocol" }
core-index = { path = "../core-index" }

core-timing = { path = "../core-timing" }

slog = "2"
serde = { workspace = true, features = ["derive"] }
simd-json = "0.19.0"
crc32fast = "1.5"
bincode = "2.0.1"
indexmap = "2.14.2"

dashmap = "6.2.1"
moka = { version = "0.12.16", features = ["sync"] }
ahash = "0.8.12"
rayon = "1.12.0"
[features]
timing = ["core-timing/timing"]
[lints] 
workspace = true
