[package]
name = "core-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
core-protocol = { path = "../core-protocol" }
core-index = {path = "../core-index"}
core-query = {path = "../core-query"}
core-logs={path="../core-logs"}
core-timing = { path = "../core-timing" }



slog="2"
serde = { workspace = true, features =["derive"]}

crc32fast="1.3"
bincode="2.0"


serde_json = "1"
indexmap = "2.14.0"
tokio ={workspace=true}
dashmap = "6.2.1"
moka = { version = "0.12.16", features = ["sync"] }
[dev-dependencies]
criterion = { workspace = true }

[features]
timing = ["core-timing/timing"]
